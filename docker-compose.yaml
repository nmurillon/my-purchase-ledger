services:
  database:
    container_name: mpl-database
    image: mysql:8.0
    command: --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: ${SQLPASSWORD}
      MYSQL_DATABASE: ${SQLDBNAME}
    ports:
      - '3306:3306'
    volumes:
      - ./database/mysql:/var/lib/mysql
  backend:
    container_name: mpl-backend
    image: dunglas/frankenphp
    build:
      context: docker/backend
      dockerfile: Dockerfile.dev
    # uncomment the following line if you want to run this in a production environment
    # restart: always
    #ports:
    #  - "80:80" # HTTP
    environment:
      SERVER_NAME: ":80"
    volumes:
      - ./app:/app
      - caddy_data:/data
      - caddy_config:/config
    # comment the following line in production, it allows to have nice human-readable logs in dev
    tty: true
    depends_on:
      - database

  caddy:
    image: caddy:2
    container_name: mpl-reverse-proxy
    environment:
      DOMAIN: ${DOMAIN}
      BACKEND: ${BACKEND}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

# Volumes needed for Caddy certificates and configuration
volumes:
  caddy_data:
  caddy_config:
